name = "hitoplp-api"
main = "src/index.ts"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]
# CI の API トークンは2つのアカウントを見られるため、反映先を固定する（Pages の deploy-web と同じアカウント）
account_id = "ae990dbbcd6583fa56e3081ac90c7fdd"

[vars]
ALLOWED_ORIGIN = "*"
# 管理画面（LP Studio）の書き込み・課金系の窓口に入れる Firebase ユーザー（src/auth.ts）。
# Firebase Auth は誰でも新規登録できる設定のため、ログインできても ALLOWED_UIDS に無い UID は通さない。
# 社員アカウントを足す時は UID をカンマ区切りで追加する（UID は秘密ではない。署名つきトークンが無いと名乗れない）。
FIREBASE_PROJECT_ID = "hitoplp"
ALLOWED_UIDS = "ySGRzlAU83MIwImFVNG58Uwy4Ty2"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "hitoplp-images"

# Secrets (set via: wrangler secret put <KEY_NAME>)
# ANTHROPIC_API_KEY
# ELEVENLABS_API_KEY
# ELEVENLABS_VOICE_ID
# ADMIN_API_KEY  (for /api/admin/* endpoints; required by /lp-publish skill)
